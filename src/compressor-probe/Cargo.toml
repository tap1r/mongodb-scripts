[package]
name = "compressor-probe"
version = "0.0.0"
edition = "2021"
publish = false
description = "Testing implementation for the network compressor analysis"

[dependencies]
# Pins are the crates that produced compressor-analysis.json on 2026-11-17.
# flate2 stays on its default rust backend (miniz_oxide). Do not enable the zlib feature.
flate2 = "=1.1.11"
snap = "=1.1.2"
zstd = "=0.14.4"
serde_json = "=1.0.154"
